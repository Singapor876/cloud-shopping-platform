<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud 微服务商城</title><style>body{margin:0;font-family:system-ui;background:#06131a;color:#e8fbff}main{max-width:1050px;margin:auto;padding:72px 24px}.hero{padding:54px;border-radius:30px;background:radial-gradient(circle at 80% 0,#1d4ed8aa,transparent 42%),linear-gradient(145deg,#083344,#111827);border:1px solid #67e8f933}h1{font-size:clamp(42px,7vw,76px);margin:12px 0}.sub{color:#67e8f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:30px 0}.card{padding:20px;border-radius:16px;background:#ffffff0b;border:1px solid #ffffff1a}.card b{color:#a5f3fc}.card p{color:#b9cbd4;line-height:1.6}.btn{display:inline-block;padding:13px 22px;border-radius:999px;background:#22d3ee;color:#083344;text-decoration:none;font-weight:800}.note{margin-top:28px;padding:18px;border-left:4px solid #22d3ee;background:#164e6355;color:#d5f7fb}</style></head><body><main><section class="hero"><div class="sub">SPRING CLOUD · VUE · MICROSERVICES</div><h1>Cloud 微服务商城</h1><p>基于若依 Cloud 二次开发的前后端分离商城系统，覆盖统一认证、网关、商品、订单、会员、内容、文件服务与前后台界面。</p><div class="grid"><div class="card"><b>统一认证与网关</b><p>集中处理登录、权限与服务入口。</p></div><div class="card"><b>商城业务模块</b><p>商品、订单、会员、内容与文件服务。</p></div><div class="card"><b>双端 Web 界面</b><p>商城用户端与后台管理端。</p></div><div class="card"><b>开源合规</b><p>保留若依 Cloud MIT 许可与来源说明。</p></div></div><a class="btn" href="https://github.com/Singapor876/cloud-shopping-platform">查看源码与中文文档</a><div class="note">这是在线项目展示页。完整商城需要服务器、MySQL、Redis、Nacos 及多个后端微服务，无法仅通过 GitHub Pages 运行。</div></section></main></body></html>
